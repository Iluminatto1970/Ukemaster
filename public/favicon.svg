<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D2D44"/>
      <stop offset="100%" stop-color="#0E7C7B"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F26419"/>
      <stop offset="100%" stop-color="#D9530D"/>
    </linearGradient>
  </defs>

  <!-- Main Rounded Container -->
  <rect x="0" y="0" width="100" height="100" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Ukulele Body -->
  <!-- Upper bout and lower bout figure-8 shape -->
  <path d="M 50,32 
           C 42,32 37,38 37,45 
           C 37,50 40,53 35,58 
           C 30,64 30,75 50,75 
           C 70,75 70,64 65,58 
           C 60,53 63,50 63,45 
           C 63,38 58,32 50,32 Z" 
        fill="url(#orangeGrad)"/>

  <!-- Soundhole -->
  <circle cx="50" cy="46" r="6" fill="#1D2D44"/>
  <circle cx="50" cy="46" r="7.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Neck -->
  <rect x="47" y="14" width="6" height="20" rx="1" fill="#E2E8F0"/>

  <!-- Headstock -->
  <path d="M 44,14 L 56,14 L 54,8 L 46,8 Z" fill="url(#orangeGrad)"/>

  <!-- Tuning pegs -->
  <circle cx="43" cy="11" r="1.8" fill="#FFFFFF"/>
  <circle cx="57" cy="11" r="1.8" fill="#FFFFFF"/>
  <circle cx="42" cy="13" r="1.8" fill="#FFFFFF"/>
  <circle cx="58" cy="13" r="1.8" fill="#FFFFFF"/>

  <!-- Bridge -->
  <rect x="44" y="66" width="12" height="3" rx="1" fill="#1D2D44"/>

  <!-- Strings (4 Ukulele Strings) -->
  <line x1="48" y1="12" x2="48" y2="66" stroke="#FFFFFF" stroke-width="0.8" opacity="0.9"/>
  <line x1="49.3" y1="12" x2="49.3" y2="66" stroke="#FFFFFF" stroke-width="0.8" opacity="0.9"/>
  <line x1="50.7" y1="12" x2="50.7" y2="66" stroke="#FFFFFF" stroke-width="0.8" opacity="0.9"/>
  <line x1="52" y1="12" x2="52" y2="66" stroke="#FFFFFF" stroke-width="0.8" opacity="0.9"/>

  <!-- Sparkle Accent -->
  <path d="M 72,25 L 73.5,28.5 L 77,30 L 73.5,31.5 L 72,35 L 70.5,31.5 L 67,30 L 70.5,28.5 Z" fill="#F26419"/>
  <path d="M 26,68 L 27,70 L 29,71 L 27,72 L 26,74 L 25,72 L 23,71 L 25,70 Z" fill="#3B82F6"/>
</svg>
